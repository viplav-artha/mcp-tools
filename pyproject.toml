[project]
name = "mcp-tools"
version = "0.1.0"
description = "MCP server exposing get_current_time, custom_web_search and text_to_sql over Streamable HTTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.5,<5.0.0",
    "httpx>=0.28.1",
    "ddgs>=9.16.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
    "starlette>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
mcp-tools = "src.server:main"

[tool.setuptools]
packages = ["src", "src.tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
